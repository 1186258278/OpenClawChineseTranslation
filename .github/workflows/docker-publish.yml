name: Docker runtime gate and publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      artifact:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: write

# All callers share this group. Never cancel a run while it is promoting tags.
concurrency:
  group: docker-publish-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      OWNER: ${{ github.repository_owner }}
      STAGING: candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: docker-context
      - name: Validate inputs and build context
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANNEL" = latest || "$CHANNEL" = nightly ]]
          [[ "$VERSION" =~ ^[0-9][A-Za-z0-9._-]*$ ]]
          test -s docker-context/openclaw-runtime.tgz
          cp Dockerfile .dockerignore docker-context/
          node --test tests/node/*.test.mjs
          python3 -m unittest discover -s tests/python -p test_container_images.py
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate on native architecture
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          load: true
          push: false
          tags: openclaw-runtime:test
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-${{ inputs.channel }}-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ inputs.channel }}-${{ matrix.arch }},mode=max
      - name: Verify actual runtime before publishing
        run: bash scripts/smoke-docker.sh openclaw-runtime:test "$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested candidate to both registries
        shell: bash
        run: |
          set -euo pipefail
          for repo in "ghcr.io/$OWNER/openclaw-zh" "$OWNER/openclaw-zh"; do
            docker tag openclaw-runtime:test "$repo:$STAGING"
            docker push "$repo:$STAGING"
          done

  promote:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OWNER: ${{ github.repository_owner }}
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
      STAGING: candidate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote both tested architectures
        shell: bash
        run: |
          set -euo pipefail
          for repo in "ghcr.io/$OWNER/openclaw-zh" "$OWNER/openclaw-zh"; do
            docker buildx imagetools create \
              --tag "$repo:$VERSION" --tag "$repo:$CHANNEL" \
              "$repo:$STAGING-amd64" "$repo:$STAGING-arm64"
          done
      - name: Anonymous registry readback
        run: |
          python3 scripts/verify-container-images.py --owner "$OWNER" \
            --tag "$VERSION" --tag "$CHANNEL" --expected-version "$VERSION" \
            --output image-readback.json
          echo '### Docker published and verified (amd64 + arm64)' >> "$GITHUB_STEP_SUMMARY"
          echo "Version: $VERSION; channel: $CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Both registries passed anonymous manifest/config readback.' >> "$GITHUB_STEP_SUMMARY"
      - name: Update Docker Hub deployment instructions
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository_owner }}/openclaw-zh
          readme-filepath: ./DOCKER_README.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-readback-${{ inputs.channel }}
          path: image-readback.json
          if-no-files-found: warn
          retention-days: 14
